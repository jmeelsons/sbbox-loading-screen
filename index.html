<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SBLOAD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: 'Roboto', 'Segoe UI', Tahoma, sans-serif;
        background: #1a1a1a;
        color: #e0e0e0;
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 30px;
        position: relative;
    }

    .bg-layer {
        position: fixed;
        inset: 0;
        z-index: -2;
        overflow: hidden;
    }

    .bg-layer .bg-slide {
        position: absolute;
        inset: 0;
        background-position: center center;
        background-size: cover;
        background-repeat: no-repeat;
        opacity: 0;
        transform: scale(1.05);
        transition: opacity 2s ease, transform 8s ease;
        will-change: opacity, transform;
    }

    .bg-layer .bg-slide.active {
        opacity: 1;
        transform: scale(1);
    }

    .bg-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.55);
        z-index: -1;
    }

    .blackout {
        position: fixed;
        inset: 0;
        background: #000;
        z-index: 100;
        opacity: 1;
        transition: opacity 1s ease;
        pointer-events: none;
    }

    .blackout.hidden {
        opacity: 0;
    }

    .server-name {
        font-family: 'Roboto', sans-serif;
        font-weight: 700;
        font-size: 3rem;
        text-transform: uppercase;
        letter-spacing: 4px;
        text-align: center;
        color: #f0f0f0;
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);

        opacity: 0;
        transform: translateY(120px);

        animation:
            slideUp 1s cubic-bezier(0.16, 1, 0.3, 1) forwards,
            pulse 2.5s ease-in-out 1.5s infinite;
        animation-play-state: paused;
    }

    .server-name.start {
        animation-play-state: running;
    }

    @keyframes slideUp {
        from {
            opacity: 0;
            transform: translateY(120px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    @keyframes pulse {
        0%, 100% { opacity: 1; }
        50%      { opacity: 0.75; }
    }

    .hint-wrapper {
        position: relative;
        width: 100%;
        max-width: 650px;
        min-height: 3em;
        display: flex;
        align-items: center;
        justify-content: center;

        opacity: 0;
        transform: translateY(80px);
        animation: slideUpHint 1s cubic-bezier(0.16, 1, 0.3, 1) 0.25s forwards;
        animation-play-state: paused;
    }

    .hint-wrapper.start {
        animation-play-state: running;
    }

    @keyframes slideUpHint {
        from {
            opacity: 0;
            transform: translateY(80px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .hint {
        font-family: 'Roboto', sans-serif;
        font-weight: 400;
        text-align: center;
        font-size: 0.95rem;
        color: #d0d0d0;
        line-height: 1.8;
        text-shadow: 0 1px 4px rgba(0, 0, 0, 0.9);
        width: 100%;

        opacity: 1;
        transform: translateY(0);
        filter: blur(0);
        transition:
            opacity 0.6s ease,
            transform 0.6s ease,
            filter 0.6s ease;
    }

    .hint.hiding {
        opacity: 0;
        transform: translateY(-10px);
        filter: blur(4px);
    }

    .hint.showing {
        opacity: 0;
        transform: translateY(10px);
        filter: blur(4px);
        transition: none;
    }

    .hint kbd {
        font-family: 'Roboto Mono', monospace;
        background: rgba(42, 42, 42, 0.8);
        border: 1px solid rgba(61, 61, 61, 0.9);
        padding: 2px 8px;
        border-radius: 4px;
        color: #e0e0e0;
    }
</style>
</head>
<body>
    <div class="bg-layer" id="bgLayer"></div>
    <div class="bg-overlay"></div>
    <div class="blackout" id="blackout"></div>

    <div class="server-name" id="serverName">SB-BOX</div>

    <div class="hint-wrapper" id="hintWrapper">
        <div class="hint" id="hint"></div>
    </div>

<script>
    const backgrounds = [
        'images/1.jpg',
        'images/2.jpg',
        'images/3.jpg',
        'images/4.jpg',
        'images/5.jpg',
        'images/6.jpg'
    ];
    const BG_INTERVAL = 6000;

    const hints = [
        'И тут начинается наша история...',
        'Скоро тут будет куча контента, но пока что пусто потому что сервер еще не известен...',
    ];

    const bgLayer = document.getElementById('bgLayer');
    const blackout = document.getElementById('blackout');
    const serverName = document.getElementById('serverName');
    const hintEl = document.getElementById('hint');
    const hintWrapper = document.getElementById('hintWrapper');

    const slides = backgrounds.map((src, i) => {
        const el = document.createElement('div');
        el.className = 'bg-slide';
        el.style.backgroundImage = `url('${src}')`;
        if (i === 0) el.classList.add('active');
        bgLayer.appendChild(el);
        return el;
    });

    let currentSlide = 0;
    function nextBackground() {
        slides[currentSlide].classList.remove('active');
        currentSlide = (currentSlide + 1) % slides.length;
        slides[currentSlide].classList.add('active');
    }

    hintEl.innerHTML = hints[Math.floor(Math.random() * hints.length)];

    let hintBusy = false;
    function showRandomHint() {
        if (hintBusy) return;
        hintBusy = true;

        hintEl.classList.add('hiding');

        setTimeout(() => {
            hintEl.classList.remove('hiding');
            hintEl.classList.add('showing');

            const randomIndex = Math.floor(Math.random() * hints.length);
            hintEl.innerHTML = hints[randomIndex];

            void hintEl.offsetWidth;

            hintEl.classList.remove('showing');
            hintBusy = false;
        }, 600);
    }
    setTimeout(() => {
        blackout.classList.add('hidden');

        setTimeout(() => {
            serverName.classList.add('start');
            hintWrapper.classList.add('start');
        }, 100);

        setInterval(nextBackground, BG_INTERVAL);

        setTimeout(() => {
            setInterval(showRandomHint, 4000);
        }, 2000);

        setTimeout(() => {
            blackout.style.display = 'none';
        }, 1200);
    }, 2000);
</script>
</body>
</html>
