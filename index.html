<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SBLOAD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html, body {
        width: 100%;
        height: 100%;
    }

    body {
        font-family: 'Roboto', 'Segoe UI', Tahoma, sans-serif;
        background: #1a1a1a;
        color: #e0e0e0;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: relative;
    }

    .bg-layer {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        z-index: -2;
        overflow: hidden;
    }

    .bg-layer .bg-slide {
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        background-position: center center;
        background-size: cover;
        background-repeat: no-repeat;
        opacity: 0;
        -webkit-transform: scale(1.08);
        transform: scale(1.08);
        -webkit-transition: opacity 2s ease, -webkit-transform 8s ease;
        transition: opacity 2s ease, transform 8s ease;
    }

    .bg-layer .bg-slide.active {
        opacity: 1;
        -webkit-transform: scale(1.03);
        transform: scale(1.03);
    }

    .bg-overlay {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        background: rgba(0, 0, 0, 0.55);
        z-index: -1;
    }

    .blackout {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        background: #000;
        z-index: 100;
        opacity: 1;
        transition: opacity 1s ease;
        pointer-events: none;
    }

    .blackout.hidden {
        opacity: 0;
    }

    .server-name {
        font-family: 'Roboto', sans-serif;
        font-weight: 700;
        font-size: 4.2rem;
        text-transform: uppercase;
        letter-spacing: 4px;
        text-align: center;
        color: #f0f0f0;
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);

        opacity: 0;
        -webkit-transform: translateY(120px);
        transform: translateY(120px);

        -webkit-animation:
            slideUp 1s cubic-bezier(0.16, 1, 0.3, 1) forwards,
            pulse 2.5s ease-in-out 1.5s infinite;
        animation:
            slideUp 1s cubic-bezier(0.16, 1, 0.3, 1) forwards,
            pulse 2.5s ease-in-out 1.5s infinite;
        -webkit-animation-play-state: paused;
        animation-play-state: paused;
    }

    .server-name.start {
        -webkit-animation-play-state: running;
        animation-play-state: running;
    }

    @-webkit-keyframes slideUp {
        from { opacity: 0; -webkit-transform: translateY(120px); }
        to   { opacity: 1; -webkit-transform: translateY(0); }
    }
    @keyframes slideUp {
        from { opacity: 0; transform: translateY(120px); }
        to   { opacity: 1; transform: translateY(0); }
    }

    @-webkit-keyframes pulse {
        0%, 100% { opacity: 1; }
        50%      { opacity: 0.75; }
    }
    @keyframes pulse {
        0%, 100% { opacity: 1; }
        50%      { opacity: 0.75; }
    }

    .hint-wrapper {
        position: relative;
        width: 100%;
        max-width: 650px;
        min-height: 3em;
        margin-top: 30px;
        display: flex;
        align-items: center;
        justify-content: center;

        opacity: 0;
        -webkit-transform: translateY(80px);
        transform: translateY(80px);
        -webkit-animation: slideUpHint 1s cubic-bezier(0.16, 1, 0.3, 1) 0.25s forwards;
        animation: slideUpHint 1s cubic-bezier(0.16, 1, 0.3, 1) 0.25s forwards;
        -webkit-animation-play-state: paused;
        animation-play-state: paused;
    }

    .hint-wrapper.start {
        -webkit-animation-play-state: running;
        animation-play-state: running;
    }

    @-webkit-keyframes slideUpHint {
        from { opacity: 0; -webkit-transform: translateY(80px); }
        to   { opacity: 1; -webkit-transform: translateY(0); }
    }
    @keyframes slideUpHint {
        from { opacity: 0; transform: translateY(80px); }
        to   { opacity: 1; transform: translateY(0); }
    }

    .hint {
        font-family: 'Roboto', sans-serif;
        font-weight: 400;
        text-align: center;
        font-size: 0.95rem;
        color: #d0d0d0;
        line-height: 1.8;
        text-shadow: 0 1px 4px rgba(0, 0, 0, 0.9);
        width: 100%;

        opacity: 1;
        -webkit-transform: translateY(0);
        transform: translateY(0);
        -webkit-transition: opacity 0.6s ease, -webkit-transform 0.6s ease;
        transition: opacity 0.6s ease, transform 0.6s ease;
    }

    .hint.hiding {
        opacity: 0;
        -webkit-transform: translateY(-10px);
        transform: translateY(-10px);
    }

    .hint.showing {
        opacity: 0;
        -webkit-transform: translateY(10px);
        transform: translateY(10px);
        -webkit-transition: none;
        transition: none;
    }

    .hint kbd {
        font-family: 'Roboto Mono', monospace;
        background: rgba(42, 42, 42, 0.8);
        border: 1px solid rgba(61, 61, 61, 0.9);
        padding: 2px 8px;
        border-radius: 4px;
        color: #e0e0e0;
    }
</style>
</head>
<body>
    <div class="bg-layer" id="bgLayer"></div>
    <div class="bg-overlay"></div>
    <div class="blackout" id="blackout"></div>

    <div class="server-name" id="serverName">WireBox</div>

    <div class="hint-wrapper" id="hintWrapper">
        <div class="hint" id="hint"></div>
    </div>

<script>
    var backgrounds = [
        'images/1.jpg',
        'images/2.jpg',
        'images/3.jpg',
        'images/4.jpg',
       //'images/5.jpg',
       //'images/6.jpg'
    ];
    var BG_INTERVAL = 6000;

    var hints = [
        'И тут начинается наша история...',
        'Скоро тут будет куча контента, но пока что пусто потому что сервер еще не известен...',
    ];

    var bgLayer = document.getElementById('bgLayer');
    var blackout = document.getElementById('blackout');
    var serverName = document.getElementById('serverName');
    var hintEl = document.getElementById('hint');
    var hintWrapper = document.getElementById('hintWrapper');

    var slides = [];
    for (var i = 0; i < backgrounds.length; i++) {
        (function (src, index) {
            var el = document.createElement('div');
            el.className = 'bg-slide';
            el.style.backgroundImage = 'url("' + src + '")';
            if (index === 0) el.className += ' active';
            bgLayer.appendChild(el);
            slides.push(el);
        })(backgrounds[i], i);
    }

    var currentSlide = 0;
    function nextBackground() {
        slides[currentSlide].className = 'bg-slide';
        currentSlide = (currentSlide + 1) % slides.length;
        slides[currentSlide].className = 'bg-slide active';
    }

    hintEl.innerHTML = hints[Math.floor(Math.random() * hints.length)];

    var hintBusy = false;
    function showRandomHint() {
        if (hintBusy) return;
        hintBusy = true;

        hintEl.className = 'hint hiding';

        setTimeout(function () {
            hintEl.className = 'hint showing';

            var randomIndex = Math.floor(Math.random() * hints.length);
            hintEl.innerHTML = hints[randomIndex];

            void hintEl.offsetWidth;

            hintEl.className = 'hint';
            hintBusy = false;
        }, 600);
    }

    setTimeout(function () {
        blackout.className = 'blackout hidden';

        setTimeout(function () {
            serverName.className = 'server-name start';
            hintWrapper.className = 'hint-wrapper start';
        }, 100);

        setInterval(nextBackground, BG_INTERVAL);

        setTimeout(function () {
            setInterval(showRandomHint, 4000);
        }, 2000);

        setTimeout(function () {
            blackout.style.display = 'none';
        }, 1200);
    }, 2000);
</script>
</body>
</html>
